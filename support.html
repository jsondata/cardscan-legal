<h1>证件拼拼技术支持</h1>
<p>遇到扫描、相册导入、A4 预览或导出问题，请发邮件至 <a href="mailto:jsondata@163.com">jsondata@163.com</a>。</p>
<p>请提供 App 版本、iPhone 型号、iOS 版本和复现步骤。反馈时请使用合成样张，避免发送身份证、银行卡等真实证件照片。</p>
<h2>常见问题</h2>
<ul><li>相机权限已关闭时，可前往系统设置为证件拼拼开启相机，或从相册选图。</li><li>添加正反面后，可导出 PDF 或 JPG，再通过系统分享面板保存到「文件」。</li></ul>
