    <h1>证件拼拼使用条款</h1>
    <p>生效日期：2026年11月17日</p>
    <p>证件拼拼是免费工具，没有广告，也没有应用内购买。它把你提供的两张照片排到一张 A4 上，并可以印上你自己写的灰色水印。</p>
    <p>裁边和清晰度取决于照片本身。请在发送前看清预览。对方是否接受这份文件，由接收方决定。</p>
    <p>水印文字由你填写。请只把导出的文件发给你正在办理该项业务的对方。</p>
    <p>联系：jsondata@163.com</p>
